query MorphoDiscoverMarkets($loan: [String!]!, $coll: [String!]!, $chains: [Int!]!, $first: Int!) {
  markets(
    first: $first
    where: { loanAssetAddress_in: $loan, collateralAssetAddress_in: $coll, chainId_in: $chains }
  ) {
    items {
      marketId
      oracle {
        address
      }
      irmAddress
      lltv
      loanAsset {
        address
      }
      collateralAsset {
        address
      }
      state {
        blockNumber
        borrowAssets
        borrowShares
        supplyAssets
        supplyShares
        timestamp
        price
      }
    }
  }
}

query MorphoPositionsByMarket($ids: [String!]!, $chains: [Int!]!, $first: Int!, $skip: Int!, $maxHf: Float) {
  marketPositions(
    first: $first
    skip: $skip
    orderBy: HealthFactor
    orderDirection: Asc
    where: { marketUniqueKey_in: $ids, chainId_in: $chains, healthFactor_lte: $maxHf }
  ) {
    items {
      user {
        address
      }
      market {
        marketId
        chain {
          id
        }
      }
      state {
        borrowShares
        collateral
      }
      healthFactor
    }
  }
}
