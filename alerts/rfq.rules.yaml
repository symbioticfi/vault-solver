# Operator policy: tune these thresholds for the deployment's traffic and deadlines.
groups:
  - name: vault-solver-rfq-rates
    interval: 1m
    rules:
      - record: vault_solver:rfq_retry_expirations:rate10m
        expr: |
          sum by (namespace, kubernetes_pod) (
            rate(solver_bot_workflow_events_total{solver="rfq-filler",event="order",outcome="expired_after_nonce_retries"}[10m])
          )
      - alert: RFQOrdersExpireAfterNonceRetries
        expr: vault_solver:rfq_retry_expirations:rate10m >= 0.01
        for: 5m
        labels:
          severity: warning
          solver: rfq-filler
        annotations:
          summary: RFQ orders repeatedly expire after nonce retry exhaustion
          description: Locally observed order expirations after exhausting the accepted-execution retry budget are at least 0.6 per minute over ten minutes and persist for five minutes. Check inclusion latency, deadlines and contention.
