rule_files:
  - rfq.rules.yaml
evaluation_interval: 1m
tests:
  - name: isolated expiry stays below the alert threshold
    interval: 1m
    input_series:
      - series: solver_bot_workflow_events_total{namespace="stage",kubernetes_pod="rfq-a",solver="rfq-filler",event="order",outcome="expired_after_nonce_retries"}
        values: 0 1+0x29
    alert_rule_test:
      - eval_time: 20m
        alertname: RFQOrdersExpireAfterNonceRetries
        exp_alerts: []
  - name: sustained expirations alert only for the affected process
    interval: 1m
    input_series:
      - series: solver_bot_workflow_events_total{namespace="stage",kubernetes_pod="rfq-a",solver="rfq-filler",event="order",outcome="expired_after_nonce_retries"}
        values: 0+1x30
      - series: solver_bot_workflow_events_total{namespace="stage",kubernetes_pod="rfq-b",solver="rfq-filler",event="order",outcome="expired_after_nonce_retries"}
        values: 0+0x30
    alert_rule_test:
      - eval_time: 20m
        alertname: RFQOrdersExpireAfterNonceRetries
        exp_alerts:
          - exp_labels:
              namespace: stage
              kubernetes_pod: rfq-a
              severity: warning
              solver: rfq-filler
            exp_annotations:
              summary: RFQ orders repeatedly expire after nonce retry exhaustion
              description: Locally observed order expirations after exhausting the accepted-execution retry budget are at least 0.6 per minute over ten minutes and persist for five minutes. Check inclusion latency, deadlines and contention.
