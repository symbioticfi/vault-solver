---
tolerations:
  - effect: NoSchedule
    key: node-region.kubernetes.io/FSN1
  - effect: NoSchedule
    key: node-region.kubernetes.io/HEL1

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: topology.kubernetes.io/region
              operator: In
              values:
                - HEL1
                - FSN1
networkPolicy:
  internet:  # rpc.mevblocker.io
    egress:
      nsSelect: kube-public
      selector:
        name: ips
        value: pl-to-internet
      ports:
        - 443
