configMap:
  data:
    config.yaml: |
      # vault-solver — RFQ filler, Sepolia testnet (chainId 11155111) profile.
      #
      # Addresses are the Sepolia deployment of the RFQ contracts. Provide secrets via env:
      #   SOLVER_PRIVATE_KEY            — the caller EOA (must hold CALLER_ROLE on the Executor)
      #   BACKEND_SHARED_SECRET     — shared secret authenticating the backend peer on /quote
      # ${VAR} fields are expanded from the environment at load time.

      chain:
        rpcUrl: ${ETH_RPC_URL} # primary; expanded from env; do not commit a real URL
        chainId: 11155111

      signer:
        keyEnv: SOLVER_PRIVATE_KEY # the CALLER_ROLE EOA that submits Executor.fill (P2)

      txManager:
        confirmations: 2

      observability:
        addr: ":9090" # /metrics, /healthz, /readyz (separate from the quote server below)
        # Optional: set env SENTRY_DSN (and SENTRY_ENVIRONMENT) to tee Error+ logs to Sentry.

      solvers:
        - name: rfq-filler
          config:
            backendUrl: http://rfq-backend:42072
            backendSharedSecretEnv: BACKEND_SHARED_SECRET # env var NAME (secret never in config)
            listenAddr: ":42073" # quote HTTP server (poll-only; no /notify)
            # Sepolia RFQ deployment:
            executor: "0xCB2C6B190090074e7493e04874aA36E2aA258554"
            reactor: "0x81ab189f6EBC8214565724078F1366a67a0E7DC9" # used at execution time
            pollIntervalMs: 333 # backend order poll cadence
            orderLimit: 20 # max open orders fetched per poll
            # solverMode: external # "external" (default) | "internal". external skips the internal-only
            #                      # discounts API and scopes to `adapters`; internal uses public discounts on all.
            solverMode: internal
            # LiquidLane adapter addresses: the candidate universe for on-chain strategy recovery (e.g.
            # after a restart) and, when the whitelist is enabled, the source of allowed adapters; the
            # quote path's inventory snapshot still comes from the backend request. Empty disables recovery.
            adapters:
              - "0x6d3456D8DcDD4F3e8a506275E22eBB9653a7bD79" # USDC LiquidLane adapter
              - "0xC06382F350618dBFf760369F3d42294aDa8F1277" # aUSD LiquidLane adapter
