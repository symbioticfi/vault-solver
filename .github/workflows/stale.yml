name: Close stale PRs
on:
  schedule:
    - cron: '30 3 * * *'

permissions:
  pull-requests: write

jobs:
  close-stale-PRs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # pin@v10.4.0
        with:
          days-before-issue-stale: -1
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-message: 'This PR has been inactive for 30 days and will be closed in 7 days unless updated.'
