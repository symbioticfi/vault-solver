name: Close stale PRs
on:
  schedule:
    - cron: '30 3 * * *'

permissions:
  pull-requests: write

jobs:
  close-stale-PRs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # pin@v11.0.0
        with:
          days-before-issue-stale: -1
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-message: 'This PR has been inactive for 30 days and will be closed in 7 days unless updated.'
