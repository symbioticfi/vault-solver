name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reusable entrypoint: an external deploy/infra workflow can gate on build/test/lint

permissions:
  contents: read

env:
  GOPRIVATE: github.com/symbioticfi/merkle-executor
  MERKLE_SDK_READ_TOKEN: ${{ secrets.MERKLE_SDK_READ_TOKEN }}

jobs:
  alert-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - name: Validate rate alerts with pinned promtool
        run: |
          archive="$RUNNER_TEMP/prometheus-3.5.0.linux-amd64.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz
          printf '%s  %s\n' e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a "$archive" \
            | sha256sum --check
          tar -xzf "$archive" --directory="$RUNNER_TEMP" prometheus-3.5.0.linux-amd64/promtool
          make test-alerts PROMTOOL="$RUNNER_TEMP/prometheus-3.5.0.linux-amd64/promtool"

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - name: Configure private SDK access
        run: bash hack/configure-private-go-modules.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # pin@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: make build

      - name: Test
        run: make test

  nonce-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - name: Configure private SDK access
        run: bash hack/configure-private-go-modules.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # pin@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # pin@v1
        with:
          version: v1.8.1

      - name: Test independent nonce reconciliation
        run: make test-txmanager-anvil

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - name: Configure private SDK access
        run: bash hack/configure-private-go-modules.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # pin@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # pin@v9.3.0
        with:
          version: v2.13.2
