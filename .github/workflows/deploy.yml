name: build & deploy

on:
  push:
    branches: [stage, main]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  dispatch:
    needs: ci
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          workflow=$([ "$REF_NAME" = "main" ] && echo deploy_prod.yml || echo deploy_stage.yml)
          gh workflow run "$workflow" \
            --repo symbioticfi/vault-solver-deploy --ref main \
            -f image_tag="$IMAGE_TAG" -f source_ref="$REF_NAME" -f source_date="$SOURCE_DATE" \
            -f registry=registry.gprptest.net -f repository=vault-solver
