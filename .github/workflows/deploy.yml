name: build & deploy

on:
  push:
    branches: [stage, main]
  # Redeploy the head of stage or main by hand
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    if: github.ref_name == 'stage' || github.ref_name == 'main'
    environment: deploy
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - id: meta
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # pin@v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # pin@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Tags are immutable, so a re-run or manual dispatch reuses the commit's image
      - id: existing
        env:
          IMAGE: symbioticfi/vault-solver:${{ github.sha }}
        run: |
          if digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -er .digest); then
            echo "::notice::$IMAGE already exists, deploying $digest"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          fi

      - id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # pin@v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: final
          push: true
          tags: symbioticfi/vault-solver:${{ github.sha }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}

  dispatch:
    needs: image
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      # The workflow's own token cannot dispatch workflows in another repository, so the job mints a
      # GitHub App installation token with Actions: write on symbioticfi/vault-solver-deploy only,
      # revoked when the job ends.
      - name: Check GitHub App settings
        env:
          APP_CLIENT_ID: ${{ vars.APP_CLIENT_ID }}
          APP_PRIVATE_KEY_SET: ${{ secrets.APP_PRIVATE_KEY != '' }}
        run: |
          ok=true
          if [ -z "$APP_CLIENT_ID" ]; then
            echo "::error::APP_CLIENT_ID is not set: add the client ID of the GitHub App with Actions: write on vault-solver-deploy as a variable of the deploy environment"
            ok=false
          fi
          if [ "$APP_PRIVATE_KEY_SET" != true ]; then
            echo "::error::APP_PRIVATE_KEY is not set: add that GitHub App's private key as a secret of the deploy environment"
            ok=false
          fi
          if [ "$ok" != true ]; then
            exit 1
          fi

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: symbioticfi
          repositories: vault-solver-deploy
          permission-actions: write

      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IMAGE_TAG: ${{ github.sha }}
          DIGEST: ${{ needs.image.outputs.digest }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          workflow=$([ "$REF_NAME" = "main" ] && echo deploy_prod.yml || echo deploy_stage.yml)
          gh workflow run "$workflow" \
            --repo symbioticfi/vault-solver-deploy --ref main \
            -f image_tag="$IMAGE_TAG" -f digest="$DIGEST"
