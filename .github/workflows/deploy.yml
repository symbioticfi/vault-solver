name: build & deploy

on:
  push:
    branches: [stage, main]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    uses: symbioticfi/github-workflows-common/.github/workflows/docker-build.yml@main
    secrets: inherit
    with:
      file: deploy/Dockerfile
      target: final
      name: ${{ github.event.repository.name }}
      build-args: |
        VERSION=${{ github.ref_name }}
        COMMIT=${{ github.sha }}
        DATE=${{ github.event.head_commit.timestamp }}

  dispatch:
    needs: image
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          DIGEST: ${{ needs.image.outputs.digest }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          workflow=$([ "$REF_NAME" = "main" ] && echo deploy_prod.yml || echo deploy_stage.yml)
          gh workflow run "$workflow" \
            --repo symbioticfi/vault-solver-deploy --ref main \
            -f image_tag="$IMAGE_TAG" -f digest="$DIGEST" \
            -f registry=registry.gprptest.net -f repository=vault-solver
