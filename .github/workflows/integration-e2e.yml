name: integration e2e

on:
  pull_request:
  push:
    branches: [main, stage]
  workflow_dispatch:
    inputs:
      integration_ref:
        description: rfq-integration branch, tag, or commit
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: vault-solver-integration-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  COREPACK_INTEGRITY_KEYS: "0"

jobs:
  smoke:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    name: ${{ matrix.profile }} smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [3f, rfq, lifi, uniswapx, redstoneoev]

    steps:
      - name: Check out vault-solver revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: vault-solver
          fetch-depth: 1
          persist-credentials: false

      - name: Require private fixture token
        env:
          RFQ_INTEGRATION_READ_TOKEN: ${{ secrets.RFQ_INTEGRATION_READ_TOKEN }}
        run: |
          if [ -z "$RFQ_INTEGRATION_READ_TOKEN" ]; then
            echo "::error::RFQ_INTEGRATION_READ_TOKEN must grant read access to rfq-integration, rfq-backend, and rfq-indexer"
            exit 1
          fi

      - name: Check out Docker integration harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          repository: symbioticfi/rfq-integration
          ref: ${{ inputs.integration_ref || vars.RFQ_INTEGRATION_REF || 'main' }}
          path: rfq-integration
          submodules: false
          fetch-depth: 1
          token: ${{ secrets.RFQ_INTEGRATION_READ_TOKEN }}
          persist-credentials: false

      - name: Initialize integration fixtures
        env:
          RFQ_INTEGRATION_READ_TOKEN: ${{ secrets.RFQ_INTEGRATION_READ_TOKEN }}
        run: |
          auth="$(printf 'x-access-token:%s' "$RFQ_INTEGRATION_READ_TOKEN" | base64 | tr -d '\n')"
          git -C rfq-integration \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            submodule update --init --recursive -- \
              lib/permit2 lib/rfq lib/core-mirror lib/uniswapx lib/grunt \
              submodules/rfq-backend submodules/rfq-indexer

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: rfq-integration/pnpm-lock.yaml

      - name: Enable pinned pnpm
        run: |
          corepack enable pnpm
          corepack prepare pnpm@10.33.0 --activate

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de # pin@v1.4.0

      - name: Build current solver and run protocol smoke
        env:
          RFQ_INTEGRATION_DIR: ${{ github.workspace }}/rfq-integration
          RFQ_SKIP_SUBMODULE_INIT: "1"
        run: ./vault-solver/hack/integration-e2e.sh "${{ matrix.profile }}" smoke

      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pin@v4.6.2
        with:
          name: vault-solver-e2e-${{ matrix.profile }}
          path: /tmp/vault-solver-e2e/${{ matrix.profile }}-smoke
          if-no-files-found: ignore
          retention-days: 7
