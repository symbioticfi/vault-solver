name: local e2e

on:
  pull_request:
  push:
    branches: [main, stage]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault-solver-local-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    name: local settlement matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out vault-solver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require pinned integration checkout
        env:
          RFQ_INTEGRATION_READ_TOKEN: ${{ secrets.RFQ_INTEGRATION_READ_TOKEN }}
          INTEGRATION_REF: ${{ vars.RFQ_INTEGRATION_REF }}
        run: |
          if [ -z "$RFQ_INTEGRATION_READ_TOKEN" ]; then
            echo "::error::RFQ_INTEGRATION_READ_TOKEN must grant read access to rfq-integration, rfq-backend, and rfq-indexer"
            exit 1
          fi
          if ! printf '%s' "$INTEGRATION_REF" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "::error::RFQ_INTEGRATION_REF must be an immutable 40-character commit SHA"
            exit 1
          fi

      - name: Check out local E2E harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          repository: symbioticfi/rfq-integration
          ref: ${{ vars.RFQ_INTEGRATION_REF }}
          path: rfq-integration
          submodules: false
          fetch-depth: 1
          token: ${{ secrets.RFQ_INTEGRATION_READ_TOKEN }}
          persist-credentials: false

      - name: Initialize private RFQ services
        env:
          RFQ_INTEGRATION_READ_TOKEN: ${{ secrets.RFQ_INTEGRATION_READ_TOKEN }}
        run: |
          auth="$(printf 'x-access-token:%s' "$RFQ_INTEGRATION_READ_TOKEN" | base64 | tr -d '\n')"
          git -C rfq-integration \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            submodule update --init --depth 1 -- \
              submodules/rfq-backend submodules/rfq-indexer

      - name: Initialize integration sources
        run: ./rfq-integration/scripts/setup.sh

      - name: Build current solver and run local outcomes
        env:
          RFQ_INTEGRATION_DIR: ${{ github.workspace }}/rfq-integration
          VAULT_SOLVER_E2E_SKIP_SETUP: "1"
        run: |
          status=0
          for profile in 3f rfq lifi uniswapx redstoneoev; do
            ./hack/integration-e2e.sh "$profile" || status=1
          done
          exit "$status"

      - name: Upload failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pin@v4.6.2
        with:
          name: vault-solver-e2e
          path: /tmp/vault-solver-e2e
          if-no-files-found: ignore
          retention-days: 7
