name: sync-stage

# Opens the stage -> main promotion PR on demand. It is a no-op when stage has nothing new or a
# promotion PR is already open.
#
# SYNC_PR_TOKEN is a fine-grained token for this repo with contents: read and pull-requests: write.
# github.token cannot be used: the repo does not let Actions open PRs, and PRs opened with it would not
# trigger ci.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open stage -> main PR
        env:
          GH_TOKEN: ${{ secrets.SYNC_PR_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::SYNC_PR_TOKEN secret is not set"
            exit 1
          fi

          ahead=$(gh api "repos/${REPO}/compare/main...stage" --jq .ahead_by)
          if [ "${ahead}" -eq 0 ]; then
            echo "stage has no commits missing from main" | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          existing=$(gh pr list -R "${REPO}" --base main --head stage --state open --json url --jq '.[0].url // empty')
          if [ -n "${existing}" ]; then
            echo "promotion PR already open: ${existing}" | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          url=$(gh pr create -R "${REPO}" --base main --head stage \
            --title "chore: merge stage into main" \
            --body "Promotes ${ahead} commit(s) from stage to main.")
          echo "opened ${url}" | tee -a "${GITHUB_STEP_SUMMARY}"
