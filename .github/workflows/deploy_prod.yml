name: Deploy prod

on:
  push:
    branches:
      - 'main'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  docker-build:
    needs: ci
    uses: symbioticfi/github-workflows-common/.github/workflows/docker-build.yml@main
    with:
      file: deploy/Dockerfile
      target: 'final'
      name: ${{ github.event.repository.name }}

  deploy-public-stage:
    name: Deploy ${{ matrix.network }}-symbiotic-fi
    needs:
      - docker-build
    strategy:
      fail-fast: false
      matrix:
        network:
          - hoodi
          - sepolia
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      network: ${{ matrix.network }}
      namespace: '${{ matrix.network }}-symbiotic-fi'
      digest: ${{ needs.docker-build.outputs.digest }}

