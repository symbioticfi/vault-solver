# Independent native 3F PUSH offers and guarded Merkle mints.
chain:
  rpcUrl: ${ETH_RPC_URL_MAINNET}
  writeRpcUrl: ${WRITE_RPC_URL}
  chainId: 1
signer:
  keyEnv: SOLVER_PRIVATE_KEY
txManager:
  confirmations: 2
  maxFeeGwei: 50
observability:
  addr: ":9090"
solvers:
  - name: threef-merkle
    config:
      mode: simulate # send enables API offers and on-chain minting
      stateDir: /persistent/threef-merkle
      executor: "0x0000000000000000000000000000000000000010" # caller is the shared signer
      curator:
        url: https://curator.example.invalid/api/v1
        # apiKeyEnv: CURATOR_API_TOKEN
      url: https://bf.3f.xyz
      apiKeyEnv: THREEF_CURATOR_API_KEY
      broker: "0x0000000000000000000000000000000000000040" # dedicated approved BF
