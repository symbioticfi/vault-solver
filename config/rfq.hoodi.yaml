# vault-solver — RFQ filler, Hoodi testnet (chainId 560048) profile.
#
# Addresses are the Hoodi deployment of the RFQ contracts. Provide secrets via env:
#   SOLVER_PRIVATE_KEY            — the caller EOA (must hold CALLER_ROLE on the Executor)
#   RFQ_BACKEND_SHARED_SECRET     — shared secret authenticating the backend peer on /quote
# ${VAR} fields are expanded from the environment at load time.

chain:
  rpcUrl: ${ETH_RPC_URL_HOODI} # primary; expanded from env; do not commit a real URL
  # rpcFallbackUrls:           # optional HTTP(S) fallbacks tried in order when rpcUrl is down
  #   - ${ETH_RPC_URL_HOODI_BACKUP}
  chainId: 560048

signer:
  keyEnv: SOLVER_PRIVATE_KEY # the CALLER_ROLE EOA that submits Executor.fill (P2)

txManager:
  confirmations: 2

observability:
  addr: ":9090" # /metrics, /healthz, /readyz (separate from the quote server below)
  # Optional: set env SENTRY_DSN (and SENTRY_ENVIRONMENT) to tee Error+ logs to Sentry.

solvers:
  - name: rfq-filler
    config:
      backendUrl: ${RFQ_BACKEND_URL}
      backendSharedSecretEnv: RFQ_BACKEND_SHARED_SECRET # env var NAME (secret never in config)
      listenAddr: ":42073" # quote HTTP server (poll-only; no /notify)
      # Hoodi RFQ deployment:
      executor: "0x6f862a9b5cd2f08e29a92558699b2863dcedc160"
      reactor: "0xead015d4c3bf576bc1d3cad8294f3dc92dae0d93" # used at execution time
      pollIntervalMs: 3000 # backend order poll cadence
      orderLimit: 20 # max open orders fetched per poll
      # Per-vault LiquidLane adapters, used only for on-chain strategy recovery (e.g. after a restart);
      # the quote path's inventory comes from the backend request. Empty disables recovery.
      vaults:
        - address: "0x0000000000000000000000000000000000000000" # Symbiotic vault
          adapter: "0x0000000000000000000000000000000000000000" # its LiquidLane adapter
          asset:   "0x0000000000000000000000000000000000000000" # vault collateral (asset hint)
