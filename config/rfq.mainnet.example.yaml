# vault-solver — RFQ filler, Ethereum mainnet (chainId 1) profile.
#
# Addresses are the mainnet deployment of the RFQ contracts. Provide secrets via env:
#   SOLVER_PRIVATE_KEY            — the caller EOA (must hold CALLER_ROLE on the Executor)
#   RFQ_BACKEND_SHARED_SECRET     — shared secret authenticating the backend peer on /quote
# ${VAR} fields are expanded from the environment at load time.

chain:
  rpcUrl: ${ETH_RPC_URL_MAINNET} # primary; expanded from env; do not commit a real URL
  rpcFallbackUrls: # optional HTTP(S) fallbacks tried in order when rpcUrl is down
    - https://rpc.mevblocker.io/fullprivacy
  chainId: 1

signer:
  keyEnv: SOLVER_PRIVATE_KEY # the CALLER_ROLE EOA that submits Executor.fill (P2)

txManager:
  confirmations: 2

observability:
  addr: ":9090" # /metrics, /healthz, /readyz (separate from the quote server below)
  # Optional: set env SENTRY_DSN (and SENTRY_ENVIRONMENT) to tee Error+ logs to Sentry.

solvers:
  - name: rfq-filler
    config:
      backendUrl: ${RFQ_BACKEND_URL}
      backendSharedSecretEnv: RFQ_BACKEND_SHARED_SECRET # env var NAME (secret never in config)
      listenAddr: ":42073" # quote HTTP server (poll-only; no /notify)
      # Mainnet RFQ deployment:
      executor: "0xe60E84218BB81539cc599A1E213d6F67058C69Cf"
      reactor: "0x5eB54c47837cC84249F697e3CD8C5D88bCc35dac" # used at execution time
      pollIntervalMs: 3000 # backend order poll cadence
      orderLimit: 20 # max open orders fetched per poll
      # solverMode: "external" (default) | "internal".
      #   external — no discounts API; `adapters` REQUIRED and scope quoting/filling (empty = startup error).
      #   internal — public discounts + every advertised adapter; `adapters` optional (extra recovery inventory).
      solverMode: external
      # LiquidLane adapters: external = required quoting/filling scope + recovery universe.
      # These must be the CONCRETE per-token adapter instances deployed by the LiquidLane
      # factory (0x3b5Bb07d7af98EBdD5A715fa09C5c10aF1749460), not the factory itself — the
      # filler resolves each adapter's vault + asset on-chain at startup. Fill the deployed
      # instance address(es) here at deploy time (query the factory's AddEntity events).
      adapters:
        - "0x3b5Bb07d7af98EBdD5A715fa09C5c10aF1749460" # TODO: replace with concrete USDC LiquidLane adapter instance
