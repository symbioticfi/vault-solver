# vault-solver — 3F Sepolia dev profile.
#
# Addresses for the BridgeFacilitatorAdapter, its vault, and the RequestWhitelist are filled in at
# deploy time. On testnet the whitelist is a mock (3F's registry is prod-only); see
# 3F_BRIDGE_FACILITATOR_INTEGRATION.md §6. Provide the key via SOLVER_PRIVATE_KEY in the env.
#
# ${VAR} fields are expanded from the environment at load time.

chain:
  rpcUrl: ${ETH_RPC_URL_SEPOLIA}        # expanded from env; do not commit a real URL
  chainId: 11155111

signer:
  keyEnv: SOLVER_PRIVATE_KEY

txManager:
  confirmations: 2

observability:
  addr: ":9090"

solvers:
  - name: 3f-bridge-facilitator
    config:
      apiBaseUrl: https://bf.dev.gcp.3f.xyz
      # Adapters this solver maintains offers for. Each must be registered with 3F as a facilitator by
      # its vault creator, with this solver's signer set as the adapter's EIP-1271 signer. Vault +
      # collateral are resolved from each adapter at startup; exposure/return caps live on the adapter
      # (read on-chain, not config). No API key — offers authenticate via the adapter's EIP-1271 check.
      adapters:
        - "0x0000000000000000000000000000000000000000"   # TODO: a deployed BridgeFacilitatorAdapter
      intervals:
        discover: 1h
        redeemPoll: 5m
        reconcile: 15m
