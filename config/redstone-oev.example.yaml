# vault-solver — RedStone OEV solver (`redstone-oev`), annotated example.
#
# An off-chain bidder for RedStone Atom OEV auctions: when a price update makes a Morpho Blue position
# liquidatable, it bids for the right to liquidate and exits the seized collateral through one Symbiotic
# LiquidLaneAdapter. It signs and bids but never submits the settlement tx (RedStone's auctioneer does),
# so no txManager block is needed. Addresses below are the Sepolia testbed (the only OEV environment).
#
# Secrets are referenced by env-var NAME and read at point of use; ${VAR} fields are expanded at load
# time. Never commit a real key or endpoint.

chain:
  rpcUrl: ${ETH_RPC_URL_SEPOLIA}        # primary EVM RPC endpoint (adapter/Morpho/Executor reads)
  chainId: 11155111                     # must match the RPC's chain id (asserted at startup)
  # rpcFallbackUrls:                    # optional HTTP(S) read fallbacks, tried in order when rpcUrl is down
  #   - ${ETH_RPC_URL_SEPOLIA_BACKUP}

signer:
  keyEnv: OEV_SIGNER_PRIVATE_KEY        # env var holding the EXECUTOR_V6 signer key (also the Executor deposit wallet)

observability:
  addr: ":9090"                         # /metrics, /healthz, /readyz
  debug: false                          # debug-level logging; the --debug CLI flag overrides this
  # Optional: set env SENTRY_DSN (and SENTRY_ENVIRONMENT) to tee Error+ logs to Sentry.

solvers:
  - name: redstone-oev
    config:
      ws:
        url: wss://dev-rwa-sepolia.oev.a.redstone.finance   # RedStone Atom OEV WebSocket (liquidations feed)
        apiKeyEnv: OEV_REDSTONE_API_KEY                      # env var NAME of the RedStone WS API key

      executor: "0xfdFB1862a53a974b166d1f0D012f524Ebd2e0EbD"   # RedStone Atom Executor (proxy) — verifies our bid signature
      adapter:  "0xB5951fecFc34f56a6Ffbd62A2c61cE328E9De70b"   # LiquidLane adapter served by this solver (TLOAN vault / TCOL collateral)
      # liquidityLens: "0x..."          # optional FrontendLiquidityLens; reads LiquidLane headroom from its
                                        # cross-adapter deallocation-cascade estimate instead of getMaxAssets(). Omit to use the adapter getter.
      callback: "0x065B612a182f360D4428cD00a8094049B3c92168"   # SymbioticOevSolver — receives Executor callback and pays the bid

      # Optional common gas accounting. Omit the entire block to skip Chainlink reads and choose bundles
      # by gross loan-token profit. Gas-limit fitting, native Executor-deposit headroom/reservations, the
      # fixed callback-funded bid, and the signed maxTxGasPriceWei cap still apply when this is omitted.
      gas:
        nativeUsdFeed: "0x694AA1769357215DE4FAC081bf1f309aDC325306" # Chainlink Sepolia ETH / USD
        nativeMaxAge: 24h                                            # native feed heartbeat plus publication slack
        tokenUsdFeeds:
          - token: "0x468BB3245BF520a0CD030BDE029c98aCEAF84C9d"   # actual adapter vault asset / loan token (TLOAN)
            feed: "0xA2F78ab2355fe2f984D808B5CeE7FD0A93D5270E"  # Chainlink Sepolia USDC / USD (proxy for TLOAN)
            maxAge: 24h                                              # set independently for every token/USD feed

      strategy:
        name: default
        config:
          # Morpho GraphQL endpoint polled for market state + at-risk positions (required by the prod monitor).
          # Public api.morpho.org does not index this custom Sepolia Morpho, so the Sepolia harness leaves it
          # empty and uses OEV_TEST_MONITOR=true + OEV_TEST_MARKETS/OEV_TEST_POSITIONS instead.
          morphoApiUrl: ""
          # discoveryMaxHealthFactor: 1.30  # only snapshot positions with health factor <= this (default 1.30);
          #                                 # local Morpho math then decides real liquidatability at the auction price
          # maxTrackedPositions: 10000      # Morpho API page size + in-memory at-risk position cap (default 10000)

          bid:
            bidEth: "0.0005"                 # minimum bid in ETH; the final bid is max(this, gross-profit share)
            authTtlMs: 60000                 # callback-auth replay window (default 60000); independent of the auction timeout
            totalBundleProfitBps: 0          # optional bid share of gross bundle profit, in native terms (requires gas)
            minBundleProfitBidBps: 1000      # extra margin after gas + bid, as bps of the final bid (requires gas)
                                              # omit/set both bps fields to 0 when the top-level gas block is omitted

          sizing:
            allowFullLiquidation: true       # seize full collateral when profitable (default true); false forces fixed 90% partial mode
            swapHaircutBps: 100              # extra safety margin on the adapter's discounted rate for slippage/staleness (default 200 = 2%)

          monitorPollMs: 10000               # default strategy monitor snapshot poll (API in prod, testMonitor on Sepolia)
          maxStateAgeMs: 90000               # max default-strategy cache age before stale_state

      maxTxGasPriceWei: "20000000000"        # signed tx.gasprice ceiling + native deposit/gas-reservation assumption;
                                              # remains positive and active when gas economics are disabled
      # maxBidWei: "1000000000000000"        # optional for default; required when strategy.name is webhook

      breaker:
        maxFailures: 3                   # halt bidding after this many failed liquidations… (default 3)
        windowMs: 3600000                # …within this window (default 3600000 = 1h); a `blacklisted` frame halts immediately

      intervals:
        opsPollMs: 30000                 # cadence of solver ops checks — Executor state (default 10000)
        executorStateMaxAgeMs: 90000     # max Executor cache age before executor_state_stale
