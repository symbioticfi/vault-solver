# lifi-merkle: LI.FI same-chain filler settling through a Merkle-funded LiquidLaneConnector.
# Supply deployed addresses; the pending fill is held in RAM. See docs/MERKLE-FILLERS.md.
chain:
  rpcUrl: ${ETH_RPC_URL_MAINNET}
  writeRpcUrl: ${WRITE_RPC_URL}
  chainId: 1

signer:
  keyEnv: SOLVER_PRIVATE_KEY

txManager:
  confirmations: 2
  maxFeeGwei: 50

observability:
  addr: ":9090"

solvers:
  - name: lifi-merkle
    config:
      strategy:
        name: default
        config:
          priceBufferBps: 20
          inventoryReserveBps: 500
          minAmount: "1000000"
          rangeCount: 8
          executionDeadlineBuffer: 12s

      orderServer:
        baseUrl: https://order.li.fi
        wsUrl: wss://order.li.fi
        apiKeyEnv: LIFI_SOLVER_API_KEY

      inputSettler:  "0x000025c3226C00B2Cdc200005a1600509f4e00C0"
      outputSettler: "0x0000000000eC36B683C2E6AC89e9A75989C22a2e"
      # Registered LI.FI solver. It is the recipe's caller (directly or through its
      # AccessManager) and the pinned recipient of the connector payment.
      executor: ${LIFI_EXECUTOR}

      # The recipes that fund fills. This solver has no adapters, solverMode or gas settings;
      # adapter-backed fills are the separate lifi-samechain solver.
      recipeExecutors: ["0x0000000000000000000000000000000000000043"]
      curator:
        url: https://curator.example.invalid/api/v1

      # Required: connector fills are discount-backed. Advertises discounts with precision 100000000.
      privateDiscountsUrl: ${RFQ_BACKEND_URL}

      # Permissioned tokens settle through one connector. With all or permissionless an order may
      # split across up to three connectors.
      tokensToQuote: permissioned
      permissionedTokens:
        - ${TOKEN_TO_REDEEM}

      quoteIntervalMs: 1000
      quoteTtl: 36s
      quoteRefreshMode: block
