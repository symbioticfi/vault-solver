# vault-solver — 3F Bridge Facilitator (`3f-bridge-facilitator`), annotated example.
#
# Bids in 3F (Grunt) bridge-loan auctions on behalf of one or more Symbiotic BridgeFacilitatorAdapters,
# funds the loans it wins, and permissionlessly redeems repaid loans back to the vault. Addresses below
# are the 3F Sepolia dev deployment.
#
# Secrets are referenced by env-var NAME and read at point of use; ${VAR} fields are expanded from the
# environment at load time. Never commit a real key or production endpoint.

chain:
  rpcUrl: ${ETH_RPC_URL_SEPOLIA}   # primary endpoint for state, fee, and receipt reads
  chainId: 11155111                # must match the RPC's chain id (asserted at startup)
  # rpcFallbackUrls:               # optional read-only fallbacks, tried in order
  #   - ${ETH_RPC_URL_SEPOLIA_BACKUP}
  # writeRpcUrl: ${WRITE_RPC_URL}  # broadcasts plus latest/pending nonce reads; defaults to rpcUrl
  # multicallAddress: "0x..."      # optional; override the default Multicall3 address for this chain

signer:
  # The bot's EOA both sends transactions (via txManager) and signs EIP-712 offers (authorized on-chain
  # by each adapter's EIP-1271 check) and the offer-listing Authorization header — no API key. Provide
  # exactly one key source, by env-var NAME — the key never enters the parsed config.
  keyEnv: SOLVER_PRIVATE_KEY       # env var holding a hex private key
  # keystorePath: ./keystore/bot.json    # ...or a go-ethereum keystore file
  # passphraseEnv: SOLVER_KEYSTORE_PASS  # (required with keystorePath)

txManager:
  confirmations: 2                 # blocks to wait past inclusion before treating a tx as final (default 2)
  maxFeeGwei: 50                   # global fee cap; the normal lifecycle stops one bump below it
  replacementIntervalMs: 30000     # attempt a capped fee bump every 30s
  pendingTimeoutMs: 300000         # switch the active nonce to cancellation after 5m
  shutdownTimeoutMs: 60000         # bound SIGTERM cancellation + receipt drain to 60s
  # tipGwei: 1                     # optional floor; omit/zero to use the minimum p25 tip over five blocks

observability:
  addr: ":9090"                    # bind address for /metrics, /healthz, /readyz
  debug: false                     # debug-level logging; the --debug CLI flag overrides this
  # Optional error reporting: set env SENTRY_DSN (and SENTRY_ENVIRONMENT) to tee Error+ logs to Sentry.

solvers:
  - name: 3f-bridge-facilitator    # registry key selecting the implementation
    config:                        # opaque to the framework; typed by the 3F solver
      apiBaseUrl: https://bf.dev.gcp.3f.xyz   # 3F Bridge Facilitator API base URL (no API key — auth is by signature)
      # httpTimeout: 30s               # per-call timeout for 3F API requests (default 30s)
      # offerExpiryBuffer: 2h          # signed-offer expiry = auction solve_start_time + this (default 2h)
      redeemBatchSize: 10              # max matured Requests redeemed per redeem() call (gas bound; default 10)

      strategy:                        # pluggable decision layer (omit ⇒ default); see docs/strategy-plan.md
        name: default                  #   "default" (in-process sizing/selection) | "webhook" (external decider)
        config: {}                     #   opaque to the framework; parsed by the named strategy

      # When adapters is omitted, all factory entities are enumerated at startup and before every
      # discovery pass, with a hard limit of 2,000 (a larger reported count is an error). A factory with
      # no entities is valid: the daemon stays ready and picks up later deployments automatically.
      # Uncommenting adapters makes that list exclusive and skips factory discovery. Either source keeps
      # only entries that authorize this solver's signer (validated via the adapter's ERC-1271
      # isValidSignature — the solver EOA or an EIP-1271 contract signer) and whose
      # adapter.vault()/vault.asset() resolve to non-zero addresses.
      adapterFactory: "0x5e0c165Acc4653bD4cf966A454C9aF1647E65Eb1"
      # liquidityLens: "0x..."          # optional FrontendLiquidityLens; when set, funding headroom is read
                                        # from its cross-adapter deallocation-cascade estimate instead of the
                                        # adapter's own getMaxAssets(). Omit to use the adapter getter.
      # adapters:                       # optional exclusive override
      #   - "0x..."

      # Per-request caps (min yield / min & max assets per request), funding headroom (getMaxAssets),
      # and concurrency (MAX_REQUESTS) live on each adapter and are read on-chain — never configured.

      intervals:
        discover: 5m                   # refresh adapters, then poll auctions and (re)offer coverage
        redeemPoll: 5m                 # how often to check for matured loans to redeem
        reconcile: 15m                 # how often to log each adapter's live open-position set (health tick)
